<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Documents - Lamu Refinery ERP</title>
<style>
*{box-sizing:border-box}body{font-family:Arial;margin:0;background:#eef2f7}
.header{background:#1a237e;color:#fff;padding:14px 18px;display:flex;justify-content:space-between}
.header a{color:#ffab40;text-decoration:none;font-weight:bold;background:#fff2;padding:6px 12px;border-radius:6px}
.container{padding:15px}
.card{background:#fff;padding:18px;border-radius:12px;box-shadow:0 4px 12px rgba(0,0,0,.1)}
.stats{display:flex;gap:10px;margin:12px 0;flex-wrap:wrap}.stat{flex:1;min-width:140px;padding:12px;border-radius:10px;text-align:center}.stat b{font-size:22px;display:block}
.green{background:#e8f5e9}.yellow{background:#fffde7}.red{background:#ffebee}.blue{background:#e8eaf6}
table{width:100%;border-collapse:collapse;margin-top:12px}th{background:#1a237e;color:#fff;padding:10px 8px;font-size:12px;text-align:left}td{padding:9px 8px;border-bottom:1px solid #ddd;font-size:12px}
.exp-ok{color:#2e7d32;font-weight:bold}.exp-warn{background:#fff176;padding:3px 7px;border-radius:10px;font-weight:bold}.exp-danger{background:#ef5350;color:#fff;padding:3px 7px;border-radius:10px;font-weight:bold}
input{padding:10px;border:1.5px solid #c5cae9;border-radius:8px;width:280px}
</style></head>
<body>
<div class="header"><div><b>LAMU REFINERY ERP</b> - Document Tracking <span style="background:#4caf50;padding:3px 8px;border-radius:10px;font-size:11px;margin-left:8px">DEMO READY ✅</span></div><a href="systems.html">◀ SYSTEMS</a></div>
<div class="container"><div class="card">
<h3 style="margin:0">Good Conduct & Compliance Tracking - HR Alerts</h3>
<div class="stats">
<div class="stat blue"><b id="cTotal">0</b>Total Workers</div>
<div class="stat green"><b id="cValid">0</b>Valid</div>
<div class="stat yellow"><b id="cExpSoon">0</b>Expiring <30 days</div>
<div class="stat red"><b id="cExp">0</b>Expired</div>
</div>
<input id="search" placeholder="Search ID or Name..." onkeyup="load()">
<div style="overflow:auto;max-height:70vh">
<table><thead><tr><th>ID</th><th>Name</th><th>Skill</th><th>Issue Date</th><th>Expiry Date</th><th>Days Left</th><th>Status</th><th>Docs</th></tr></thead><tbody id="tbody"></tbody></table>
</div>
</div></div>
<script>
let KEY_REC='lamu_recruitment_demo'; let KEY_DOC='lamu_documents_demo';
let docs=JSON.parse(localStorage.getItem(KEY_DOC)||'[]');
if(docs.length==0){
 let rec=JSON.parse(localStorage.getItem(KEY_REC)||'[]');
 // create demo docs from recruitment or default
 let today=new Date(); let demo=[
  {id:'54321234',name:'MORRIS KWENA',skill:'Casual Labour',issue:addDays(today,-340),expiry:addDays(today,25)},
  {id:'28286984',name:'MUHSIN ORONJE',skill:'Engineer',issue:addDays(today,-200),expiry:addDays(today,165)},
  {id:'10004032',name:'SOPHIA MANYASA',skill:'Operator',issue:addDays(today,-400),expiry:addDays(today,-35)},
  {id:'25253647',name:'MUSA ATITWA',skill:'Driver',issue:addDays(today,-100),expiry:addDays(today,265)},
  {id:'98765432',name:'JEROM SAKWA',skill:'Mason',issue:addDays(today,-10),expiry:addDays(today,355)},
 ];
 docs=demo; localStorage.setItem(KEY_DOC,JSON.stringify(docs));
}
function addDays(d,n){let x=new Date(d); x.setDate(x.getDate()+n); return x.toISOString().split('T')[0];}
function daysLeft(exp){let e=new Date(exp), t=new Date(); return Math.ceil((e-t)/(1000*60*60*24));}
function load(){
 let q=(document.getElementById('search').value||'').toUpperCase();
 let tb=document.getElementById('tbody'); tb.innerHTML=''; let cV=0,cS=0,cE=0;
 docs.filter(r=>!q||r.id.includes(q)||r.name.includes(q)).forEach(r=>{
  let dl=daysLeft(r.expiry); let cls='exp-ok', txt=dl+' days', status='Valid';
  if(dl<0){cls='exp-danger'; txt=dl+' EXPIRED'; status='EXPIRED'; cE++;} else if(dl<=30){cls='exp-warn'; txt=dl+' SOON'; status='Expiring Soon'; cS++;} else cV++;
  tb.innerHTML+=`<tr><td>${r.id}</td><td><b>${r.name}</b></td><td>${r.skill}</td><td>${r.issue}</td><td>${r.expiry}</td><td><span class="${cls}">${txt}</span></td><td>${status}</td><td>ID✓ KRA✓ NSSF✓ SHIF✓ Good Conduct✓</td></tr>`;
 });
 document.getElementById('cTotal').innerText=docs.length; document.getElementById('cValid').innerText=cV; document.getElementById('cExpSoon').innerText=cS; document.getElementById('cExp').innerText=cE;
}
load();
</script></body></html>
