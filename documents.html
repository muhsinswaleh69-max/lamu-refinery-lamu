<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Document Tracking - ERP v2 Expiry Alerts</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{font-family:Arial;margin:0;background:#f4f6f9}
.header{background:#1a237e;color:white;padding:12px;display:flex;justify-content:space-between}
.alert-box{margin:10px;padding:12px;border-radius:8px}
.alert-red{background:#ffebee;border-left:5px solid #d32f2f}
.alert-yellow{background:#fff8e1;border-left:5px solid #ff9800}
table{width:100%;border-collapse:collapse;background:white}
th{background:#1a237e;color:white;padding:8px;font-size:12px}
td{padding:6px;border-bottom:1px solid #ddd;font-size:13px;text-align:center}
.expiry-input{width:130px}
.verified{background:#c8e6c9}.pending{background:#fff3e0}
.btn{padding:5px 10px;border:none;border-radius:4px;cursor:pointer;color:white}
.btn-green{background:#2e7d32}.btn-orange{background:#ef6c00}
.expired{color:red;font-weight:bold}.nearing{color:#ff9800;font-weight:bold}.ok{color:green}
</style>
</head><body>
<div class="header"><span>DOCUMENT TRACKING - ERP v2 + EXPIRY ALERTS ✅</span><a href="systems.html" style="color:#ff8a65;text-decoration:none;font-weight:bold">SYSTEMS</a></div>

<div style="padding:10px;background:#000;color:white;text-align:center">
<h3 style="margin:5px">📄 Document Verification → Unlocks Attendance/Fleet/Store + HR Expiry Alerts</h3>
<div id="counts" style="color:orange"></div>
<div id="hrAlerts"></div>
</div>

<table id="docTable">
<thead><tr>
<th>ID</th><th>Name</th><th>Skill</th><th>ID</th><th>KRA</th><th>NSSF</th><th>SHIF</th><th>Good Conduct</th><th>GC Issue</th><th>GC Expiry</th><th>Days Left</th><th>Status</th><th>Action</th>
</tr></thead><tbody></tbody>
</table>

<script>
const supa = supabase.createClient('https://xbxzbszpephjgnxjszjn.supabase.co','eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhieHpic3pwZXBoamdueGpzenpuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTgwODUyNzYsImV4cCI6MjA3MzY2MTI3Nn0.CV0rV5Ov8c0YkVlV0t3V4X9B5Z6...');
let docs=[];

async function load(){
 let {data} = await supa.from('lamu_documents').select('*').order('created_at',{ascending:false});
 docs=data||[];
 let verified = docs.filter(d=>d.verified).length;
 document.getElementById('counts').innerHTML = `✅ Documents: ${docs.length} | Pending: ${docs.length-verified} | Verified: ${verified}`;
 renderAlerts();
 renderTable();
}
function daysLeft(expiry){
 if(!expiry) return null;
 let diff = Math.ceil((new Date(expiry) - new Date())/(1000*60*60*24));
 return diff;
}
function renderAlerts(){
 let expiring = docs.filter(d=>{
   let dl = daysLeft(d.good_conduct_expiry);
   return dl!==null && dl<=30;
 });
 let html='';
 if(expiring.length>0){
   html+=`<div class="alert-box alert-red">🚨 <b>HR ALERT: ${expiring.length} Good Conduct EXPIRED or <30 days!</b><br>`;
   expiring.forEach(d=>{
     let dl = daysLeft(d.good_conduct_expiry);
     html+=`${d.name} (${d.id}) - Expiry: ${d.good_conduct_expiry} - ${dl<0? 'EXPIRED '+Math.abs(dl)+' days ago' : dl+' days left'} <br>`;
   });
   html+=`</div>`;
 }
 let nearing = docs.filter(d=>{let dl=daysLeft(d.good_conduct_expiry); return dl>30 && dl<=90});
 if(nearing.length>0){
   html+=`<div class="alert-box alert-yellow">⚠️ <b>Warning: ${nearing.length} Good Conduct expiring in 90 days</b><br>`;
   nearing.forEach(d=>{html+=`${d.name} - ${d.good_conduct_expiry} (${daysLeft(d.good_conduct_expiry)} days left)<br>`});
   html+=`</div>`;
 }
 document.getElementById('hrAlerts').innerHTML = html || '<div style="color:#4caf50">✅ All Good Conduct Valid</div>';
}
function renderTable(){
 let tbody=document.querySelector('#docTable tbody'); tbody.innerHTML='';
 docs.forEach(d=>{
   let dl = daysLeft(d.good_conduct_expiry);
   let dlText='', dlClass='ok';
   if(dl===null) dlText='-';
   else if(dl<0){dlText=`EXPIRED ${Math.abs(dl)}d ago`; dlClass='expired';}
   else if(dl<=30){dlText=`${dl} days - URGENT`; dlClass='nearing';}
   else if(dl<=90){dlText=`${dl} days`; dlClass='nearing';}
   else dlText=`${dl} days`;

   tbody.innerHTML+=`<tr class="${d.verified?'verified':'pending'}">
   <td>${d.id}</td><td style="text-align:left">${d.name}</td><td>${d.skill}</td>
   <td><input type="checkbox" ${d.id_doc?'checked':''} onchange="upd('${d.id}','id_doc',this.checked)"></td>
   <td><input type="checkbox" ${d.kra?'checked':''} onchange="upd('${d.id}','kra',this.checked)"></td>
   <td><input type="checkbox" ${d.nssf?'checked':''} onchange="upd('${d.id}','nssf',this.checked)"></td>
   <td><input type="checkbox" ${d.shif?'checked':''} onchange="upd('${d.id}','shif',this.checked)"></td>
   <td><input type="checkbox" ${d.good_conduct?'checked':''} onchange="upd('${d.id}','good_conduct',this.checked)"></td>
   <td><input type="date" class="expiry-input" value="${d.good_conduct_issue||''}" onchange="upd('${d.id}','good_conduct_issue',this.value)"></td>
   <td><input type="date" class="expiry-input" value="${d.good_conduct_expiry||''}" onchange="upd('${d.id}','good_conduct_expiry',this.value)"></td>
   <td class="${dlClass}">${dlText}</td>
   <td>${d.verified?'✅ Verified':'⏳ Pending'}</td>
   <td><button class="btn ${d.verified?'btn-green':'btn-orange'}" onclick="verify('${d.id}')">${d.verified?'Verified':'VERIFY'}</button></td>
   </tr>`;
 });
}
async function upd(id,field,val){ await supa.from('lamu_documents').update({[field]:val}).eq('id',id); load(); }
async function verify(id){
 let rec = docs.find(x=>x.id==id);
 if(!rec.id_doc||!rec.kra||!rec.nssf||!rec.shif||!rec.good_conduct){alert('Tick ALL 5 documents first!'); return;}
 await supa.from('lamu_documents').update({verified:true,status:'Verified'}).eq('id',id);
 load();
}
load();
</script></body></html>
