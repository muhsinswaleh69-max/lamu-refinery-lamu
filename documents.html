<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Document Tracking - ERP LINKED</title><script src="https://unpkg.com/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}body{background:#f3f4f6}.nav{background:#0D4F8B;color:#fff;padding:12px;display:flex;justify-content:space-between}.nav a{color:#FFC000;text-decoration:none;font-weight:bold}.header{background:#111827;color:#fff;padding:12px;text-align:center}.container{padding:12px}.card{background:#fff;padding:12px;border-radius:8px;box-shadow:0 2px 6px rgba(0,0,0,.1);border-top:4px solid #0D4F8B}table{width:100%;border-collapse:collapse;font-size:12px}th,td{border:1px solid #ddd;padding:6px}th{background:#0D4F8B;color:#fff}button{padding:6px 10px;border:none;border-radius:6px;font-weight:bold;cursor:pointer}.check{width:18px;height:18px}</style>
</head><body>
<div class="nav"><b>DOCUMENT TRACKING - ERP VERIFICATION ✅</b><a href="systems.html">SYSTEMS</a></div>
<div class="header"><h2>📄 Document Verification → Unlocks Attendance/Fleet/Store</h2><p id="status" style="color:#FFC000">Connecting...</p><p style="font-size:11px">Tick ID, KRA, NSSF, SHIF, Good Conduct → Click VERIFY → Worker can check-in!</p></div>
<div class="container"><div class="card"><div style="overflow-x:auto"><table><thead><tr><th>ID</th><th>Name</th><th>Skill</th><th>ID</th><th>KRA</th><th>NSSF</th><th>SHIF</th><th>Good Conduct</th><th>Status</th><th>Action</th></tr></thead><tbody id="docTable"></tbody></table></div></div></div>
<script>
const SUPABASE_URL = "https://dnjsdcmtwrvydmoalmzc.supabase.co";
const SUPABASE_KEY = "sb_publishable_ECV6XUpesPYbEccQpwSx6A_5oyQxJmV";
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
async function loadDocs(){let {data}=await sb.from('lamu_documents').select('*').order('created_at',{ascending:false}).limit(1000);let docs=data||[];document.getElementById('status').innerText="✅ Documents: "+docs.length+" | Pending: "+docs.filter(d=>!d.verified).length+" | Verified: "+docs.filter(d=>d.verified).length;let tb=document.getElementById('docTable');tb.innerHTML='';docs.forEach(d=>{tb.innerHTML+=`<tr style="${d.verified?'background:#dcfce7':''}"><td>${d.id}</td><td><b>${d.name}</b></td><td>${d.skill}</td><td><input type="checkbox" class="check" ${d.id_doc?'checked':''} onchange="updateDoc('${d.id}','id_doc',this.checked)"></td><td><input type="checkbox" class="check" ${d.kra?'checked':''} onchange="updateDoc('${d.id}','kra',this.checked)"></td><td><input type="checkbox" class="check" ${d.nssf?'checked':''} onchange="updateDoc('${d.id}','nssf',this.checked)"></td><td><input type="checkbox" class="check" ${d.shif?'checked':''} onchange="updateDoc('${d.id}','shif',this.checked)"></td><td><input type="checkbox" class="check" ${d.good_conduct?'checked':''} onchange="updateDoc('${d.id}','good_conduct',this.checked)"></td><td>${d.verified?'✅ Verified':'⏳ '+d.status}</td><td><button onclick="verifyDoc('${d.id}')" style="background:${d.verified?'#16a34a':'#f59e0b'};color:#fff">${d.verified?'Verified':'VERIFY 👆'}</button></td></tr>`});}
async function updateDoc(id,field,val){await sb.from('lamu_documents').update({[field]:val}).eq('id',id);}
async function verifyDoc(id){
 let {data}=await sb.from('lamu_documents').select('*').eq('id',id).single();
 if(!data.id_doc || !data.kra || !data.good_conduct){ if(!confirm('Documents not complete! Still verify?')) return; }
 await sb.from('lamu_documents').update({verified:true,status:'Verified'}).eq('id',id);
 alert('✅ '+data.name+' VERIFIED! Now can work in Attendance / Store / Fleet!');
 loadDocs();
}
loadDocs();
</script></body></html>
