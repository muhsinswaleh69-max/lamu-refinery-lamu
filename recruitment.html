<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Recruitment - Lamu Refinery FIXED</title>
<style>
*{box-sizing:border-box}body{font-family:Arial;margin:0;background:#eef2f7}
.header{background:#1a237e;color:#fff;padding:12px 15px;display:flex;justify-content:space-between}
.header a{color:#ffab40;text-decoration:none;font-weight:bold}
.container{display:flex;gap:15px;padding:15px;flex-wrap:wrap}
.left{width:320px;background:#fff;padding:15px;border-radius:10px;box-shadow:0 2px 8px rgba(0,0,0,.1)}
.right{flex:1;background:#fff;padding:15px;border-radius:10px;min-width:600px}
input,select{width:100%;padding:10px;margin:6px 0;border:1px solid #ccc;border-radius:6px}
button.save{width:100%;padding:12px;background:#1a237e;color:#fff;border:none;border-radius:6px;font-weight:bold;cursor:pointer;font-size:15px}
button.save:active{transform:scale(0.97)}
table{width:100%;border-collapse:collapse}th{background:#1a237e;color:#fff;padding:8px;font-size:12px;text-align:left}td{padding:7px;border-bottom:1px solid #ddd;font-size:13px}
.success{background:#c8e6c9;color:#2e7d32;padding:10px;border-radius:6px;margin-top:10px;font-weight:bold}.error{background:#ffcdd2;color:#c62828;padding:10px;border-radius:6px;margin-top:10px}
</style>
</head>
<body>
<div class="header"><span>Recruitment - ERP FIXED ✅</span><a href="systems.html">SYSTEMS</a></div>
<div class="container">
<div class="left">
<h3>Add Applicant</h3>
<input id="rid" placeholder="ID e.g. 54321234" value="54321234">
<input id="rname" placeholder="Name e.g. MORRIS KWENA" value="MORRIS KWENA">
<input id="rphone" placeholder="Phone e.g. 0712321232" value="0712321232">
<select id="rvillage"><option>Mokowe</option><option>Lamu</option><option>Hindi</option><option>Mpeketoni</option></select>
<select id="rskill"><option>Casual Labour</option><option>Mason</option><option>Carpenter</option><option>Driver</option><option>Operator</option><option>Engineer</option></select>
<input id="rexp" type="number" value="3" placeholder="Exp">
<select id="rstatus"><option>New Applicant</option><option>Shortlisted</option><option selected>Hired</option></select>
<button class="save" onclick="saveData()">+ SAVE TO CLOUD</button>
<div id="msg"></div>
</div>
<div class="right"><h3>Applicants</h3><div id="count" style="color:#1a237e;font-weight:bold">Loading...</div><table><thead><tr><th>ID</th><th>Name</th><th>Phone</th><th>Village</th><th>Skill</th><th>Exp</th><th>Status</th></tr></thead><tbody id="tbody"></tbody></table></div>
</div>
<script>
const SUPA_REST='https://dnjsdmvtwrvydmoalmzjc.supabase.co/rest/v1';
const SUPA_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRuanNkY210d3J2eWRtb2FsbXpjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAyNjMzNDAsImV4cCI6MjEwNTgzOTM0MH0.iFa1BU0SNyADDferrj7szN2lISgxLrfb6Qus1aVthLI';
async function load(){
 try{
  let res=await fetch(`${SUPA_REST}/lamu_recruitment?select=*&order=created_at.desc`,{headers:{apikey:SUPA_KEY,Authorization:'Bearer '+SUPA_KEY}});
  let data=await res.json();
  document.getElementById('count').innerText=`Total Applicants: ${data.length}`;
  let tb=document.getElementById('tbody'); tb.innerHTML='';
  data.forEach(r=>{tb.innerHTML+=`<tr><td>${r.id}</td><td><b>${r.name}</b></td><td>${r.phone||''}</td><td>${r.village||''}</td><td>${r.skill||''}</td><td>${r.experience||0}yr</td><td>${r.status}</td></tr>`;});
 }catch(e){document.getElementById('count').innerText='Load failed: '+e.message;}
}
async function saveData(){
 let id=document.getElementById('rid').value.trim();
 let name=document.getElementById('rname').value.trim().toUpperCase();
 let phone=document.getElementById('rphone').value.trim();
 let village=document.getElementById('rvillage').value;
 let skill=document.getElementById('rskill').value;
 let exp=parseInt(document.getElementById('rexp').value)||2;
 let status=document.getElementById('rstatus').value;
 let msg=document.getElementById('msg');
 if(!id||!name){msg.className='error';msg.innerText='Enter ID and Name';return;}
 msg.className=''; msg.innerText='Saving MORRIS KWENA...';
 try{
   let res=await fetch(`${SUPA_REST}/lamu_recruitment`,{method:'POST',headers:{apikey:SUPA_KEY,Authorization:'Bearer '+SUPA_KEY,'Content-Type':'application/json','Prefer':'resolution=merge-duplicates'},body:JSON.stringify({id,name,phone,village,skill,experience:exp,status})});
   let txt=await res.text();
   if(!res.ok) throw new Error(txt);
   msg.className='success'; msg.innerText=`✅ SAVED! ${name} (${id}) - Reloading...`;
   // Auto to other tables
   let today=new Date().toISOString().split('T')[0]; let expD=new Date(); expD.setFullYear(expD.getFullYear()+1);
   fetch(`${SUPA_REST}/lamu_documents`,{method:'POST',headers:{apikey:SUPA_KEY,Authorization:'Bearer '+SUPA_KEY,'Content-Type':'application/json','Prefer':'resolution=merge-duplicates'},body:JSON.stringify({id,name,phone,skill,good_conduct_issue:today,good_conduct_expiry:expD.toISOString().split('T')[0]})});
   fetch(`${SUPA_REST}/lamu_workers`,{method:'POST',headers:{apikey:SUPA_KEY,Authorization:'Bearer '+SUPA_KEY,'Content-Type':'application/json','Prefer':'resolution=merge-duplicates'},body:JSON.stringify({id,name,phone,skill,rate:1500})});
   load();
   document.getElementById('rid').value=''; document.getElementById('rname').value='';
 }catch(e){msg.className='error'; msg.innerText='FAILED: '+e.message;}
}
load();
</script>
</body>
</html>
