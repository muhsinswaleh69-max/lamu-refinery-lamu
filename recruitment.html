<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Recruitment - Lamu Refinery</title>
<style>
*{box-sizing:border-box}body{font-family:Arial;margin:0;background:#0a194e}
.header{background:linear-gradient(90deg,#0a194e,#0f2c8a);color:#fff;padding:14px 20px;display:flex;justify-content:space-between;align-items:center;border-bottom:3px solid #ffb81c}
.header b{color:#ffb81c}.header a{color:#0a194e;background:#ffb81c;text-decoration:none;font-weight:bold;padding:7px 16px;border-radius:20px}
.container{display:flex;gap:16px;padding:16px;flex-wrap:wrap}
.left{width:350px;background:#fff;padding:20px;border-radius:14px;box-shadow:0 8px 24px rgba(0,0,0,.3);border-top:4px solid #ffb81c}
.right{flex:1;background:#fff;padding:20px;border-radius:14px;min-width:650px;box-shadow:0 8px 24px rgba(0,0,0,.3)}
input,select{width:100%;padding:12px;margin:8px 0;border:1.8px solid #0f2c8a33;border-radius:10px;background:#f6f8ff}
input:focus,select:focus{border-color:#0f2c8a;outline:none;background:#fff}
button.save{width:100%;padding:14px;background:linear-gradient(90deg,#0f2c8a,#1a42c0);color:#fff;border:none;border-radius:10px;font-weight:bold;cursor:pointer;font-size:15px;letter-spacing:0.5px;margin-top:10px;box-shadow:0 4px 12px #0f2c8a44}
button.save:hover{transform:translateY(-1px);box-shadow:0 6px 16px #0f2c8a66}
.stats{display:flex;gap:10px;margin:14px 0}.stat{flex:1;background:linear-gradient(135deg,#0f2c8a,#1e3fb8);color:#fff;padding:12px;border-radius:10px;text-align:center}.stat b{font-size:22px;display:block;color:#ffb81c}
table{width:100%;border-collapse:collapse;margin-top:10px}th{background:#0f2c8a;color:#ffb81c;padding:11px 8px;font-size:12px;text-align:left}td{padding:10px 8px;border-bottom:1px solid #e8eaf6;font-size:13px}
.success{background:linear-gradient(90deg,#e8f5e9,#c8e6c9);color:#1b5e20;padding:12px;border-radius:8px;margin-top:12px;font-weight:bold;border-left:4px solid #4caf50}
.badge{padding:4px 10px;border-radius:20px;font-size:11px;font-weight:bold}.hired{background:#0f2c8a;color:#ffb81c}.new{background:#fff3cd;color:#856404}
h3{color:#0f2c8a}
</style></head>
<body>
<div class="header"><div><b>DANGOTE LAMU REFINERY</b> - Recruitment ERP <span style="background:#ffb81c;color:#0a194e;padding:4px 10px;border-radius:20px;font-size:11px;margin-left:10px">DEMO READY ✅</span></div><a href="systems.html">◀ SYSTEMS</a></div>
<div class="container">
<div class="left">
<h3 style="margin:0 0 12px">➕ Add Applicant</h3>
<input id="rid" placeholder="ID Number e.g. 54321234"><input id="rname" placeholder="Full Name e.g. MORRIS KWENA"><input id="rphone" placeholder="Phone 07...">
<select id="rvillage"><option>Mokowe</option><option>Lamu Island</option><option>Hindi</option><option>Mpeketoni</option><option>Witu</option></select>
<select id="rskill"><option>Casual Labour</option><option>Mason</option><option>Carpenter</option><option>Steel Fixer</option><option>Plumber</option><option>Electrician</option><option>Driver</option><option>Operator</option><option>Engineer</option></select>
<input id="rexp" type="number" value="2"><select id="rstatus"><option>New Applicant</option><option>Shortlisted</option><option selected>Hired</option></select>
<button class="save" onclick="saveData()">+ SAVE APPLICANT TO SYSTEM</button><div id="msg"></div>
<div style="margin-top:14px;font-size:11px;color:#0f2c8a88;background:#f6f8ff;padding:8px;border-radius:6px">Built by Muhsin | SKYNET-CYBER SHIANDA - Offline HR Demo</div>
</div>
<div class="right"><h3 style="margin:0">👥 Applicants Database</h3><div class="stats"><div class="stat"><b id="cTotal">0</b>Total</div><div class="stat"><b id="cHired">0</b>Hired</div><div class="stat"><b id="cNew">0</b>New</div></div>
<div style="overflow:auto;max-height:75vh"><table><thead><tr><th>ID</th><th>Name</th><th>Phone</th><th>Village</th><th>Skill</th><th>Exp</th><th>Status</th></tr></thead><tbody id="tbody"></tbody></table></div></div></div>
<script>
let KEY='lamu_recruitment_demo'; let data=JSON.parse(localStorage.getItem(KEY)||'[]');
if(data.length==0){ data=[{id:'28286984',name:'MUHSIN ORONJE',phone:'0712345678',village:'Mokowe',skill:'Engineer',experience:3,status:'Hired'},{id:'10004032',name:'SOPHIA MANYASA',phone:'0722123456',village:'Mokowe',skill:'Operator',experience:2,status:'Hired'},{id:'25253647',name:'MUSA ATITWA',phone:'0711223344',village:'Mokowe',skill:'Driver',experience:5,status:'Hired'},{id:'54321234',name:'MORRIS KWENA',phone:'0712321232',village:'Mokowe',skill:'Casual Labour',experience:3,status:'Hired'},{id:'98765432',name:'JEROM SAKWA',phone:'0789900987',village:'Hindi',skill:'Mason',experience:4,status:'New Applicant'}]; localStorage.setItem(KEY,JSON.stringify(data));}
function load(){let tb=document.getElementById('tbody');tb.innerHTML='';data.forEach(r=>{tb.innerHTML+=`<tr><td>${r.id}</td><td><b>${r.name}</b></td><td>${r.phone}</td><td>${r.village}</td><td>${r.skill}</td><td>${r.experience} yr</td><td><span class="badge ${r.status=='Hired'?'hired':'new'}">${r.status}</span></td></tr>`;});document.getElementById('cTotal').innerText=data.length;document.getElementById('cHired').innerText=data.filter(x=>x.status=='Hired').length;document.getElementById('cNew').innerText=data.filter(x=>x.status!='Hired').length;}
function saveData(){let id=document.getElementById('rid').value.trim(),name=document.getElementById('rname').value.trim().toUpperCase(),phone=document.getElementById('rphone').value.trim(),village=document.getElementById('rvillage').value,skill=document.getElementById('rskill').value,exp=parseInt(document.getElementById('rexp').value)||0,status=document.getElementById('rstatus').value,msg=document.getElementById('msg');if(!id||!name){msg.innerHTML='<div class="success" style="background:#ffebee;color:#c62828;border-color:#c62828">Enter ID and Name</div>';return;}let i=data.findIndex(x=>x.id==id);if(i>=0)data[i]={id,name,phone,village,skill,experience:exp,status};else data.unshift({id,name,phone,village,skill,experience:exp,status});localStorage.setItem(KEY,JSON.stringify(data));load();msg.innerHTML=`<div class="success">✅ SAVED! ${name} - ${id}</div>`;document.getElementById('rid').value='';document.getElementById('rname').value='';let docs=JSON.parse(localStorage.getItem('lamu_documents_demo')||'[]');if(!docs.find(x=>x.id==id)){let t=new Date(),e=new Date();e.setFullYear(e.getFullYear()+1);docs.unshift({id,name,skill,issue:t.toISOString().split('T')[0],expiry:e.toISOString().split('T')[0]});localStorage.setItem('lamu_documents_demo',JSON.stringify(docs));}}load();
</script></body></html>
