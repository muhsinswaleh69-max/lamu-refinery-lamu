<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Recruitment - Lamu Refinery CLOUD</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}body{background:#f3f4f6}.nav{background:#0D4F8B;color:#fff;padding:10px 15px;display:flex;justify-content:space-between}.nav a{color:#FFC000;text-decoration:none;font-weight:bold;margin-left:10px}.header{background:#111827;color:#fff;padding:15px;text-align:center}.card{background:#fff;padding:15px;border-radius:8px;box-shadow:0 2px 6px rgba(0,0,0,.1);border-top:4px solid #0D4F8B;margin-bottom:15px}input,select,button{width:100%;padding:8px;margin:4px 0;border:1px solid #ddd;border-radius:4px}label{font-size:11px;font-weight:bold;color:#0D4F8B;display:block;margin-top:6px}button{background:#0D4F8B;color:#fff;font-weight:bold;border:none;cursor:pointer}table{width:100%;border-collapse:collapse;margin-top:10px;font-size:11px}th,td{border:1px solid #ddd;padding:5px}th{background:#0D4F8B;color:#fff}.container{padding:15px;display:grid;grid-template-columns:1fr 3fr;gap:15px}@media(max-width:900px){.container{grid-template-columns:1fr}}</style></head><body><div class="nav"><div><b>LAMU REFINERY - CLOUD</b></div><div><a href="index.html">HOME</a></div></div><div class="header"><h2 style="color:#fff">👷 RECRUITMENT - CLOUD SAVED ✅</h2><p id="today"></p><p id="count" style="color:#FFC000;font-weight:bold">Loading...</p></div><div class="container"><div class="card"><h3>Add Applicant</h3><label>ID</label><input id="appID"><label>Name</label><input id="appName"><label>Phone</label><input id="appPhone"><label>Village</label><select id="appVillage"><option>Mokowe</option><option>Hindi</option><option>Lamu Town</option><option>Mpeketoni</option><option>Kiunga</option><option>Faza</option><option>Witu</option><option>Other</option></select><label>Skill</label><select id="appSkill"><option>Casual Labour</option><option>Mason</option><option>Carpenter</option><option>Welder</option><option>Electrician</option><option>Plumber</option><option>Steel Fixer</option><option>Driver</option><option>Operator</option><option>Engineer</option><option>Safety Officer</option></select><label>Exp</label><input id="appExp" type="number"><label>Status</label><select id="appStatus"><option>New Applicant</option><option>Shortlisted</option><option>Hired</option><option>Rejected</option></select><button onclick="addApp()">+ SAVE TO CLOUD</button><hr style="margin:10px 0"><input id="searchBox" placeholder="Search..." oninput="render()" style="background:#fef9c3"></div><div class="card"><div style="overflow-x:auto"><table><thead><tr><th>ID</th><th>Name</th><th>Phone</th><th>Village</th><th>Skill</th><th>Exp</th><th>Status</th><th>Action</th></tr></thead><tbody id="appTable"></tbody></table></div></div></div><script>const SUPABASE_URL="https://dnpsdcmtwrvydmoalmzc.supabase.co";const SUPABASE_KEY="sb_publishable_ECV6XUpesPYbEccQpwSx6A_5oyQxJmV";const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);let apps=[];async function loadApps(){let {data}=await sb.from('lamu_recruitment').select('*').order('created_at',{ascending:false}).limit(1000);if(data){apps=data;render();}}async function addApp(){let id=document.getElementById('appID').value.trim(),name=document.getElementById('appName').value.trim(),phone=document.getElementById('appPhone').value.trim(),village=document.getElementById('appVillage').value,skill=document.getElementById('appSkill').value,exp=document.getElementById('appExp').value,status=document.getElementById('appStatus').value;if(!id||!name||!phone){alert('ID Name Phone required');return;}let {error}=await sb.from('lamu_recruitment').insert([{id,name,phone,village,skill,exp,status,date:new Date().toLocaleDateString()}]);if(error)alert(error.message);else{loadApps();document.getElementById('appID').value='';document.getElementById('appName').value='';}}function render(){let q=document.getElementById('searchBox').value.toLowerCase();let tb=document.getElementById('appTable');tb.innerHTML='';let f=apps.filter(a=>!q||a.id.toLowerCase().includes(q)||a.name.toLowerCase().includes(q)||a.phone.includes(q));f.slice(0,500).forEach(a=>{tb.innerHTML+=`<tr><td>${a.id}</td><td>${a.name}</td><td>${a.phone}</td><td>${a.village}</td><td>${a.skill}</td><td>${a.exp}yr</td><td>${a.status}</td><td><button onclick="delApp('${a.id}')" style="background:red;padding:2px">Del</button></td></tr>`});document.getElementById('count').innerText='Cloud Total: '+apps.length;}async function delApp(id){if(confirm('Delete?')){await sb.from('lamu_recruitment').delete().eq('id',id);loadApps();}}document.getElementById('today').innerText='Today: '+new Date().toDateString();loadApps();</script></body></html>
