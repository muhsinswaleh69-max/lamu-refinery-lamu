<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Recruitment HR FINAL</title><script src="https://unpkg.com/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}body{background:#f3f4f6}.nav{background:#0D4F8B;color:#fff;padding:12px;display:flex;justify-content:space-between}.nav a{color:#FFC000;text-decoration:none;font-weight:bold}.header{background:#111827;color:#fff;padding:12px;text-align:center}.container{padding:12px;display:grid;grid-template-columns:320px 1fr;gap:12px}@media(max-width:900px){.container{grid-template-columns:1fr}}.card{background:#fff;padding:12px;border-radius:8px;box-shadow:0 2px 6px rgba(0,0,0,.1);border-top:4px solid #0D4F8B}input,select,button{width:100%;padding:9px;margin:4px 0;border:1px solid #ddd;border-radius:6px}label{font-size:11px;font-weight:bold;color:#0D4F8B;display:block;margin-top:5px}button{background:#0D4F8B;color:#fff;font-weight:bold;border:none;cursor:pointer}table{width:100%;border-collapse:collapse;font-size:12px}th,td{border:1px solid #ddd;padding:6px}th{background:#0D4F8B;color:#fff}tr{cursor:pointer}tr:hover{background:#e0f2fe}.selected{background:#fef9c3!important}.status-btn{padding:4px 8px;border-radius:12px;font-size:11px;font-weight:bold;cursor:pointer;border:none}.new{background:#e5e7eb}.short{background:#fde68a;color:#92400e}.hired{background:#bbf7d0;color:#065f46}.rejected{background:#fecaca;color:#991b1b}.bulk-bar{background:#fffbeb;padding:10px;border-radius:8px;margin-bottom:8px;display:flex;gap:8px;align-items:center;border:1px dashed #f59e0b}</style>
</head><body>
<div class="nav"><b>LAMU REFINERY - HR SELECT ✅</b><a href="index.html">HOME</a></div>
<div class="header"><h2>👷 HR RECRUITMENT - CLICK TO SHORTLIST</h2><p id="today"></p><p id="status" style="color:#FFC000">Connecting...</p><p style="font-size:11px;margin-top:4px">💡 Tip: Click STATUS button to change: New → Shortlisted → Hired → Rejected | Click row to select | Use checkboxes for bulk</p></div>
<div class="container">
<div class="card"><h3>Add Applicant</h3><label>ID</label><input id="appID"><label>Name</label><input id="appName"><label>Phone</label><input id="appPhone"><label>Village</label><select id="appVillage"><option>Mokowe</option><option>Hindi</option><option>Lamu Town</option><option>Mpeketoni</option><option>Kiunga</option><option>Faza</option><option>Witu</option><option>Other</option></select><label>Skill</label><select id="appSkill"><option>Casual Labour</option><option>Mason</option><option>Carpenter</option><option>Welder</option><option>Electrician</option><option>Plumber</option><option>Steel Fixer</option><option>Driver</option><option>Operator</option><option>Engineer</option><option>Safety Officer</option></select><label>Exp</label><input id="appExp" type="number" value="7"><label>Status</label><select id="appStatus"><option>New Applicant</option><option>Shortlisted</option><option>Hired</option><option>Rejected</option></select><button onclick="addApp()">+ SAVE TO CLOUD</button><hr style="margin:8px 0"><input id="searchBox" placeholder="Search..." oninput="render()" style="background:#fef9c3"></div>
<div>
<div class="bulk-bar"><span>HR Bulk Action: </span><input type="checkbox" id="selectAll" onchange="toggleAll(this)" style="width:20px"><label style="display:inline">Select All</label><button onclick="bulkAction('Shortlisted')" style="background:#f59e0b;width:auto;padding:6px 12px">⭐ Shortlist Selected (<span id="selCount">0</span>)</button><button onclick="bulkAction('Hired')" style="background:#16a34a;width:auto;padding:6px 12px">✅ Hire Selected</button><button onclick="bulkAction('Rejected')" style="background:#dc2626;width:auto;padding:6px 12px">❌ Reject Selected</button></div>
<div class="card"><div style="overflow-x:auto"><table><thead><tr><th><input type="checkbox" id="headCheck" onchange="toggleAll(this)"></th><th>ID</th><th>Name</th><th>Phone</th><th>Village</th><th>Skill</th><th>Exp</th><th>Status (CLICK TO CHANGE)</th><th>Del</th></tr></thead><tbody id="appTable"></tbody></table></div></div>
</div></div>
<script>
const SUPABASE_URL = "https://dnjsdcmtwrvydmoalmzc.supabase.co";
const SUPABASE_KEY = "sb_publishable_ECV6XUpesPYbEccQpwSx6A_5oyQxJmV";
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
let apps=[], selected=new Set();
async function loadApps(){try{let {data}=await sb.from('lamu_recruitment').select('*').order('created_at',{ascending:false}).limit(1000);apps=data||[];document.getElementById('status').innerText="✅ CLOUD CONNECTED - Total: "+apps.length+" | Shortlisted: "+apps.filter(a=>a.status==='Shortlisted').length+" | Hired: "+apps.filter(a=>a.status==='Hired').length;render();}catch(e){document.getElementById('status').innerText="❌ "+e.message}}
async function addApp(){let id=document.getElementById('appID').value.trim(),name=document.getElementById('appName').value.trim(),phone=document.getElementById('appPhone').value.trim(),village=document.getElementById('appVillage').value,skill=document.getElementById('appSkill').value,exp=document.getElementById('appExp').value,status=document.getElementById('appStatus').value;if(!id||!name||!phone){alert('ID Name Phone required');return;}let {error}=await sb.from('lamu_recruitment').insert([{id,name,phone,village,skill,exp,status,date:new Date().toLocaleDateString()}]);if(error)alert(error.message);else loadApps();}
function getStatusClass(s){if(s==='Shortlisted')return 'short';if(s==='Hired')return 'hired';if(s==='Rejected')return 'rejected';return 'new';}
function render(){let q=document.getElementById('searchBox').value.toLowerCase();let tb=document.getElementById('appTable');tb.innerHTML='';let filtered=apps.filter(a=>!q||a.id.toLowerCase().includes(q)||a.name.toLowerCase().includes(q)||a.skill.toLowerCase().includes(q));filtered.forEach(a=>{let isSel=selected.has(a.id);tb.innerHTML+=`<tr class="${isSel?'selected':''}" onclick="toggleSelect('${a.id}')"><td onclick="event.stopPropagation()"><input type="checkbox" ${isSel?'checked':''} onchange="toggleSelect('${a.id}')"></td><td>${a.id}</td><td><b>${a.name}</b></td><td>${a.phone}</td><td>${a.village}</td><td>${a.skill}</td><td>${a.exp}yr</td><td onclick="event.stopPropagation()"><button class="status-btn ${getStatusClass(a.status)}" onclick="changeStatus('${a.id}')">${a.status} 👆 CLICK</button></td><td onclick="event.stopPropagation()"><button onclick="delApp('${a.id}')" style="background:red;padding:3px 6px">Del</button></td></tr>`});document.getElementById('selCount').innerText=selected.size;}
function toggleSelect(id){if(selected.has(id))selected.delete(id);else selected.add(id);render();}
function toggleAll(el){if(el.checked){apps.forEach(a=>selected.add(a.id));}else{selected.clear();}document.getElementById('selectAll').checked=el.checked;document.getElementById('headCheck').checked=el.checked;render();}
async function changeStatus(id){
 let cur=apps.find(a=>a.id===id); if(!cur)return;
 let order=['New Applicant','Shortlisted','Hired','Rejected'];
 let idx=order.indexOf(cur.status); let next=order[(idx+1)%order.length];
 if(!confirm(`Change ${cur.name} from ${cur.status} to ${next}?`)) return;
 let {error}=await sb.from('lamu_recruitment').update({status:next}).eq('id',id);
 if(error)alert(error.message); else loadApps();
}
async function bulkAction(newStatus){
 if(selected.size===0)return alert('Select applicants first - click row or checkbox!');
 if(!confirm(`Change ${selected.size} selected to ${newStatus}?`)) return;
 for(let id of selected){await sb.from('lamu_recruitment').update({status:newStatus}).eq('id',id);}
 selected.clear(); loadApps(); alert(`✅ ${selected.size} Updated to ${newStatus} - but count was before clear. Check table!`);
 // reload count after
 setTimeout(()=>alert(`Done! ${newStatus} complete!`),500);
}
async function delApp(id){if(confirm('Delete '+id+'?')){await sb.from('lamu_recruitment').delete().eq('id',id);loadApps();}}
document.getElementById('today').innerText=new Date().toDateString();loadApps();
</script></body></html>
