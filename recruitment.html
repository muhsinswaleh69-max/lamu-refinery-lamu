<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Recruitment - FIXED</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>body{font-family:Arial;margin:0;background:#f4f6f9}th{background:#1a237e;color:#fff;padding:6px}td{padding:6px;border-bottom:1px solid #ddd}</style>
</head><body>
<h3 style="background:#1a237e;color:#fff;padding:10px">Recruitment - ERP Fixed ✅ | <a href="systems.html" style="color:orange">SYSTEMS</a></h3>
<div style="display:flex;gap:10px;padding:10px">
<div style="width:300px;background:#fff;padding:10px;border-radius:8px">
<h4>Add Applicant</h4>
<input id="rid" placeholder="ID e.g. 37966445" style="width:100%;margin:5px 0;padding:8px"><br>
<input id="rname" placeholder="Name e.g. JEROM SAKWA" style="width:100%;margin:5px 0;padding:8px"><br>
<input id="rphone" placeholder="Phone e.g. 0788990099" style="width:100%;margin:5px 0;padding:8px"><br>
<select id="rvillage" style="width:100%;margin:5px 0;padding:8px"><option>Mokowe</option><option>Lamu</option><option>Hindi</option></select>
<select id="rskill" style="width:100%;margin:5px 0;padding:8px"><option>Casual Labour</option><option>Mason</option><option>Carpenter</option><option>Steel Fixer</option><option>Driver</option><option>Operator</option><option>Engineer</option></select>
<input id="rexp" type="number" placeholder="Exp Years e.g. 7" style="width:100%;margin:5px 0;padding:8px"><br>
<select id="rstatus" style="width:100%;margin:5px 0;padding:8px"><option>New Applicant</option><option>Shortlisted</option><option>Hired</option></select><br>
<button onclick="save()" style="width:100%;padding:10px;background:#1a237e;color:#fff;border:none;border-radius:5px;cursor:pointer">+ SAVE TO CLOUD</button>
<div id="msg" style="color:green;margin-top:10px"></div>
</div>
<div style="flex:1;background:#fff;padding:10px;border-radius:8px;overflow:auto">
<table style="width:100%;border-collapse:collapse"><thead><tr><th>ID</th><th>Name</th><th>Phone</th><th>Village</th><th>Skill</th><th>Exp</th><th>Status</th></tr></thead><tbody id="tbody"></tbody></table>
</div>
</div>
<script>
const SUPA_URL='https://xbxzbszpephjgnxjszjn.supabase.co';
const SUPA_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhieHpic3pwZXBoamdueGpzenpuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTgwODUyNzYsImV4cCI6MjA3MzY2MTI3Nn0.CV0rV5Ov8c0YkVlV0t3V4X9B5Z6YxXxX'; // REPLACE WITH YOUR REAL KEY FROM OLD FILE
const client=supabase.createClient(SUPA_URL,SUPA_KEY);
async function load(){
 let {data}=await client.from('lamu_recruitment').select('*').order('created_at',{ascending:false});
 let tb=document.getElementById('tbody'); tb.innerHTML='';
 (data||[]).forEach(r=>{
   tb.innerHTML+=`<tr><td>${r.id}</td><td>${r.name}</td><td>${r.phone}</td><td>${r.village}</td><td>${r.skill}</td><td>${r.experience||r.exp||''}yr</td><td>${r.status}</td></tr>`;
 });
}
async function save(){
 let id=document.getElementById('rid').value.trim();
 let name=document.getElementById('rname').value.trim().toUpperCase();
 let phone=document.getElementById('rphone').value.trim();
 let village=document.getElementById('rvillage').value;
 let skill=document.getElementById('rskill').value;
 let exp=parseInt(document.getElementById('rexp').value)||0;
 let status=document.getElementById('rstatus').value;
 if(!id||!name){alert('Enter ID and Name');return;}
 // FIXED: NO 'date' column! Only columns that exist!
 let {error}=await client.from('lamu_recruitment').upsert([{id, name, phone, village, skill, experience: exp, status}], {onConflict:'id'});
 if(error){alert('Save failed: '+error.message); return;}
 document.getElementById('msg').innerText='Saved! '+name;
 load();
 // Auto create in other ERP tables if Hired
 if(status==='Hired'){
   await client.from('lamu_documents').upsert([{id, name, phone, skill, good_conduct_issue: new Date().toISOString().split('T')[0], good_conduct_expiry: new Date(Date.now()+365*86400000).toISOString().split('T')[0]}], {onConflict:'id'});
   await client.from('lamu_workers').upsert([{id, name, phone, skill}], {onConflict:'id'});
   if(skill==='Driver'||skill==='Operator') await client.from('lamu_fleet').upsert([{id, driver_name:name, skill, plate:'TBD'}], {onConflict:'id'});
 }
}
load();
</script>
</body></html>
