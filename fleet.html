<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fleet Log - ERP LINKED</title><script src="https://unpkg.com/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}body{background:#f3f4f6}.nav{background:#0D4F8B;color:#fff;padding:12px;display:flex;justify-content:space-between}.nav a{color:#FFC000;text-decoration:none;font-weight:bold}.header{background:#111827;color:#fff;padding:12px;text-align:center}.card{background:#fff;padding:12px;border-radius:8px;margin:12px;box-shadow:0 2px 6px rgba(0,0,0,.1)}table{width:100%;border-collapse:collapse;font-size:12px}th,td{border:1px solid #ddd;padding:6px}th{background:#0D4F8B;color:#fff}input,button{padding:8px;margin:4px;border:1px solid #ddd;border-radius:6px}button{background:#0D4F8B;color:#fff;font-weight:bold}</style>
</head><body>
<div class="nav"><b>FLEET & DRIVER LOG - ERP AUTO ✅</b><a href="systems.html">SYSTEMS</a></div>
<div class="header"><h2>🚛 Fleet - Drivers auto from Recruitment</h2><p id="status" style="color:#FFC000">Connecting...</p></div>
<div class="card"><table><thead><tr><th>ID</th><th>Driver</th><th>Plate</th><th>License Expiry</th><th>Skill</th><th>Update Plate</th></tr></thead><tbody id="fleetTable"></tbody></table></div>
<script>
const SUPABASE_URL = "https://dnjsdcmtwrvydmoalmzc.supabase.co";
const SUPABASE_KEY = "sb_publishable_ECV6XUpesPYbEccQpwSx6A_5oyQxJmV";
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
async function loadFleet(){let {data}=await sb.from('lamu_fleet').select('*').order('created_at',{ascending:false});let f=data||[];document.getElementById('status').innerText="✅ Fleet Drivers: "+f.length+" (Auto from Recruitment when Hired as Driver/Operator)";let tb=document.getElementById('fleetTable');tb.innerHTML='';f.forEach(r=>{tb.innerHTML+=`<tr><td>${r.id}</td><td>${r.driver_name}</td><td><input id="plate_${r.id}" value="${r.plate}" placeholder="KAA 123X"></td><td><input id="exp_${r.id}" value="${r.license_expiry}" type="date"></td><td>${r.skill}</td><td><button onclick="saveFleet('${r.id}')">Save</button></td></tr>`});}
async function saveFleet(id){let plate=document.getElementById('plate_'+id).value, exp=document.getElementById('exp_'+id).value; await sb.from('lamu_fleet').update({plate,license_expiry:exp}).eq('id',id); alert('✅ Saved!'); loadFleet();}
loadFleet();
</script></body></html>
